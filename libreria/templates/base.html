<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Libreria di Casa{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blu:      #1e3a5f;
      --blu-med:  #2c5282;
      --blu-chiar:#ebf4ff;
      --oro:      #b7791f;
      --oro-chiar:#fefcbf;
      --verde:    #276749;
      --rosso:    #c53030;
      --grigio:   #4a5568;
      --sfondo:   #f7f8fa;
      --bianco:   #ffffff;
      --bordo:    #e2e8f0;
      --testo:    #2d3748;
      --radius:   8px;
      --shadow:   0 1px 3px rgba(0,0,0,.1);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--sfondo);
      color: var(--testo);
      font-size: 15px;
      line-height: 1.6;
    }

    /* NAV */
    nav {
      background: var(--blu);
      color: #fff;
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    nav .brand {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-decoration: none;
      color: #fff;
      margin-right: auto;
    }
    nav a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: .9rem;
      padding: .3rem .6rem;
      border-radius: var(--radius);
      transition: background .15s;
    }
    nav a:hover { background: rgba(255,255,255,.15); color: #fff; }

    /* MAIN */
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    /* FLASH */
    .flash { padding: .75rem 1rem; border-radius: var(--radius);
             margin-bottom: 1rem; font-size: .9rem; }
    .flash.success { background: #c6f6d5; color: var(--verde); }
    .flash.danger  { background: #fed7d7; color: var(--rosso); }
    .flash.warning { background: var(--oro-chiar); color: var(--oro); }
    .flash.info    { background: var(--blu-chiar); color: var(--blu-med); }

    /* CARD */
    .card {
      background: var(--bianco);
      border: 1px solid var(--bordo);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    /* BOTTONI */
    .btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .45rem 1rem; border-radius: var(--radius);
      font-size: .88rem; font-weight: 500; cursor: pointer;
      border: none; text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary  { background: var(--blu-med); color: #fff; }
    .btn-success  { background: var(--verde);   color: #fff; }
    .btn-danger   { background: var(--rosso);   color: #fff; }
    .btn-outline  { background: transparent; color: var(--blu-med);
                    border: 1.5px solid var(--blu-med); }
    .btn-sm { padding: .3rem .7rem; font-size: .82rem; }

    /* FORM */
    label { display: block; font-size: .85rem; font-weight: 500;
            color: var(--grigio); margin-bottom: .3rem; }
    input[type=text], input[type=password], select, textarea {
      width: 100%; padding: .5rem .75rem;
      border: 1.5px solid var(--bordo); border-radius: var(--radius);
      font-size: .95rem; color: var(--testo);
      background: var(--bianco);
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--blu-med);
    }
    textarea { resize: vertical; min-height: 90px; }
    .form-group { margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 1rem; }

    /* TABELLA */
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      background: var(--blu); color: #fff;
      padding: .6rem .75rem; text-align: left; font-weight: 500;
    }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: var(--blu-chiar); }
    tbody td { padding: .55rem .75rem; border-bottom: 1px solid var(--bordo); }

    /* BADGE */
    .badge {
      display: inline-block; padding: .2rem .55rem;
      border-radius: 999px; font-size: .78rem; font-weight: 600;
    }
    .badge-blu  { background: var(--blu-chiar); color: var(--blu-med); }
    .badge-oro  { background: var(--oro-chiar); color: var(--oro); }
    .badge-verde{ background: #c6f6d5; color: var(--verde); }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
                  gap: .75rem; margin-bottom: 1.25rem; }
    .stat-card {
      background: var(--bianco); border: 1px solid var(--bordo);
      border-radius: var(--radius); padding: .9rem 1rem; text-align: center;
    }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; color: var(--blu-med); }
    .stat-card .lbl { font-size: .78rem; color: var(--grigio); margin-top: .1rem; }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      nav { gap: .75rem; }
      main { padding: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      table { font-size: .82rem; }
      thead th:nth-child(n+5) { display: none; }
      tbody td:nth-child(n+5) { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a class="brand" href="{{ url_for('catalogo') }}">📚 Libreria di Casa</a>
  <a href="{{ url_for('catalogo') }}">Catalogo</a>
  <a href="{{ url_for('nuovo') }}">+ Libro</a>
  <a href="{{ url_for('importa') }}">Importa</a>
  <a href="{{ url_for('logout') }}">Esci</a>
</nav>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
