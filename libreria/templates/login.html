<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso – Libreria di Casa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e3a5f;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: #fff; border-radius: 12px;
      padding: 2.5rem 2rem; width: 100%; max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }
    h1 { font-size: 1.4rem; color: #1e3a5f; margin-bottom: .25rem; }
    p  { font-size: .9rem; color: #718096; margin-bottom: 1.5rem; }
    label { display: block; font-size: .85rem; font-weight: 500;
            color: #4a5568; margin-bottom: .35rem; }
    input[type=password] {
      width: 100%; padding: .6rem .85rem;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 1rem; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #2c5282; }
    button {
      width: 100%; padding: .65rem;
      background: #2c5282; color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1e3a5f; }
    .errore { color: #c53030; font-size: .88rem; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📚 Libreria di Casa</h1>
    <p>Inserisci la password per accedere.</p>
    {% if errore %}<div class="errore">{{ errore }}</div>{% endif %}
    <form method="post">
      <label for="pw">Password</label>
      <input type="password" id="pw" name="password"
             autofocus autocomplete="current-password">
      <button type="submit">Entra</button>
    </form>
  </div>
</body>
</html>
